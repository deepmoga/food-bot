<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Bot Tester</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #111b21; color: #e9edef; height: 100vh; display: flex; flex-direction: column; }
.header { background: #202c33; padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2a3942; }
.header .avatar { width: 40px; height: 40px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.header h2 { font-size: 16px; font-weight: 600; }
.header p { font-size: 12px; color: #8696a0; }
.config { background: #1a2830; padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #2a3942; }
.config input, .config select { background: #2a3942; border: 1px solid #3b4a54; color: #e9edef; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
.config input { flex: 1; min-width: 140px; }
.config label { font-size: 12px; color: #8696a0; }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; position: relative; }
.msg .time { font-size: 11px; color: #8696a0; margin-top: 2px; text-align: right; }
.msg.out { background: #005c4b; align-self: flex-end; border-radius: 8px 0 8px 8px; }
.msg.in { background: #202c33; align-self: flex-start; border-radius: 0 8px 8px 8px; }
.msg.system { background: #1a2830; align-self: center; font-size: 12px; color: #8696a0; padding: 4px 10px; border-radius: 16px; }
.buttons-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.wa-btn { background: #0a7cff22; border: 1px solid #0a7cff; color: #0a7cff; padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
.wa-btn:hover { background: #0a7cff44; }
.input-area { background: #202c33; padding: 10px 16px; display: flex; gap: 8px; border-top: 1px solid #2a3942; }
.input-area input { flex: 1; background: #2a3942; border: none; color: #e9edef; padding: 10px 14px; border-radius: 24px; font-size: 14px; outline: none; }
.input-area button { background: #25d366; border: none; color: white; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 18px; }
.quick-btns { background: #1a2830; padding: 8px 16px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid #2a3942; }
.q-btn { background: #2a3942; border: 1px solid #3b4a54; color: #e9edef; padding: 5px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; }
.q-btn:hover { background: #3b4a54; }
.loading { display: none; align-self: flex-start; background: #202c33; padding: 10px 16px; border-radius: 0 8px 8px 8px; }
.loading span { display: inline-block; width: 8px; height: 8px; background: #8696a0; border-radius: 50%; animation: bounce 1s infinite; margin: 0 2px; }
.loading span:nth-child(2) { animation-delay: 0.2s; }
.loading span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }
</style>
</head>
<body>

<div class="header">
  <div class="avatar">🍽️</div>
  <div>
    <h2>WhatsApp Bot Tester</h2>
    <p id="statusText">Configure below and start testing</p>
  </div>
</div>

<div class="config">
  <label>Server URL:</label>
  <input id="serverUrl" value="https://foodbot.officialdigitalmarketing.in" placeholder="http://localhost:3001">
  <label>Phone:</label>
  <input id="testPhone" value="919876543210" style="max-width:150px">
  <label>Vendor Phone ID:</label>
  <input id="phoneId" value="" placeholder="WA Phone Number ID" style="max-width:180px">
  <button class="q-btn" onclick="saveConfig()" style="background:#25d366;border-color:#25d366">Save Config</button>
</div>

<div id="messages" class="messages">
  <div class="msg system">Configure server URL and Vendor Phone ID above, then type a message</div>
</div>
<div id="loadingDots" class="loading"><span></span><span></span><span></span></div>

<div class="quick-btns">
  <span style="font-size:11px;color:#8696a0;margin-right:4px">Quick:</span>
  <button class="q-btn" onclick="sendText('hi')">hi</button>
  <button class="q-btn" onclick="sendText('menu')">menu</button>
  <button class="q-btn" onclick="sendText('cart')">cart</button>
  <button class="q-btn" onclick="sendText('cancel')">cancel</button>
  <button class="q-btn" onclick="sendText('timings')">timings</button>
  <button class="q-btn" onclick="sendText('1')">1</button>
  <button class="q-btn" onclick="sendText('2')">2</button>
  <button class="q-btn" onclick="sendText('skip')">skip</button>
  <button class="q-btn" onclick="sendLocation()">📍 Share Location</button>
  <button class="q-btn" onclick="clearChat()" style="color:#e53935">Clear</button>
</div>

<div class="input-area">
  <input id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMsg()">
  <button onclick="sendMsg()">➤</button>
</div>

<script>
let config = {
  serverUrl: localStorage.getItem('fb_server') || 'https://foodbot.officialdigitalmarketing.in',
  phone: localStorage.getItem('fb_phone') || '919876543210',
  phoneId: localStorage.getItem('fb_phoneid') || ''
};

// Load saved config
document.getElementById('serverUrl').value = config.serverUrl;
document.getElementById('testPhone').value = config.phone;
document.getElementById('phoneId').value = config.phoneId;

function saveConfig() {
  config.serverUrl = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
  config.phone = document.getElementById('testPhone').value.trim();
  config.phoneId = document.getElementById('phoneId').value.trim();
  localStorage.setItem('fb_server', config.serverUrl);
  localStorage.setItem('fb_phone', config.phone);
  localStorage.setItem('fb_phoneid', config.phoneId);
  document.getElementById('statusText').textContent = 'Config saved! Ready to test.';
  addMsg('Config saved! ✅', 'system');
}

function addMsg(text, type, buttons = []) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + type;

  // Format WhatsApp-style bold *text*
  const formatted = text
    .replace(/\*([^*]+)\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');

  div.innerHTML = formatted;

  if (buttons.length) {
    const row = document.createElement('div');
    row.className = 'buttons-row';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'wa-btn';
      btn.textContent = b.title || b.id;
      btn.onclick = () => sendButton(b.id, b.title || b.id);
      row.appendChild(btn);
    });
    div.appendChild(row);
  }

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'});
  div.appendChild(time);

  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function showLoading(show) {
  const l = document.getElementById('loadingDots');
  l.style.display = show ? 'flex' : 'none';
  document.getElementById('messages').scrollTop = 99999;
}

async function sendWebhook(messageObj) {
  if (!config.phoneId) {
    addMsg('Please set Vendor Phone ID in config!', 'system');
    return;
  }

  const payload = {
    entry: [{
      changes: [{
        value: {
          metadata: { phone_number_id: config.phoneId },
          messages: [{ ...messageObj, from: config.phone, timestamp: Date.now() }]
        }
      }]
    }]
  };

  showLoading(true);
  try {
    await fetch(config.serverUrl + '/webhook', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    // Poll for bot response
    await new Promise(r => setTimeout(r, 1500));
    await fetchBotResponse();
  } catch(e) {
    addMsg('Error: ' + e.message, 'system');
  }
  showLoading(false);
}

async function fetchBotResponse() {
  try {
    const res = await fetch(config.serverUrl + '/test/last-messages?phone=' + config.phone);
    if (!res.ok) return;
    const msgs = await res.json();
    msgs.forEach(m => {
      const btns = m.buttons || [];
      addMsg(m.text || m.body || JSON.stringify(m), 'in', btns);
    });
  } catch(e) {
    // Server might not have /test endpoint — show notice
    addMsg('(Bot response sent to WhatsApp — add /test endpoint to see here)', 'system');
  }
}

function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendText(text);
}

function sendText(text) {
  addMsg(text, 'out');
  sendWebhook({
    id: 'msg_' + Date.now(),
    type: 'text',
    text: { body: text }
  });
}

function sendButton(id, title) {
  addMsg(title, 'out');
  sendWebhook({
    id: 'msg_' + Date.now(),
    type: 'interactive',
    interactive: {
      type: 'button_reply',
      button_reply: { id, title }
    }
  });
}

function sendLocation() {
  const lat = prompt('Enter Latitude (e.g. 30.9010):', '30.9010');
  const lng = prompt('Enter Longitude (e.g. 75.8573):', '75.8573');
  if (!lat || !lng) return;
  addMsg(`📍 Location: ${lat}, ${lng}`, 'out');
  sendWebhook({
    id: 'msg_' + Date.now(),
    type: 'location',
    location: {
      latitude: parseFloat(lat),
      longitude: parseFloat(lng),
      name: 'Test Location',
      address: 'Test Address'
    }
  });
}

function clearChat() {
  document.getElementById('messages').innerHTML =
    '<div class="msg system">Chat cleared. Send a message to start.</div>';
}
</script>
</body>
</html>
