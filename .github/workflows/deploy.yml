name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          # Go to project directory
          cd /home/site6/public_html
          
          # Pull latest code
          git pull origin main
          
          # Install production dependencies
          npm install --production
          
          # Delete old processes if they exist to clear bad path/name registration
          pm2 delete food-bot || true
          pm2 delete foodbot || true
          
          # Start the process fresh with the correct path and name
          pm2 start index.js --name food-bot
          
          # Save PM2 state
          pm2 save
          
          # Run diagnostics and output to public/diagnostics.txt
          echo "=== DIAGNOSTICS RUN AT $(date) ===" > public/diagnostics.txt
          echo "=== PM2 LIST ===" >> public/diagnostics.txt
          pm2 list >> public/diagnostics.txt
          echo "=== PM2 SHOW food-bot ===" >> public/diagnostics.txt
          pm2 show food-bot >> public/diagnostics.txt
          echo "=== PM2 ERROR LOGS ===" >> public/diagnostics.txt
          tail -n 100 ~/.pm2/logs/food-bot-error.log >> public/diagnostics.txt 2>&1
          echo "=== PM2 OUT LOGS ===" >> public/diagnostics.txt
          tail -n 100 ~/.pm2/logs/food-bot-out.log >> public/diagnostics.txt 2>&1
          echo "=== NETSTAT PORT LISTENING ===" >> public/diagnostics.txt
          netstat -tulnp | grep node >> public/diagnostics.txt 2>&1 || true


