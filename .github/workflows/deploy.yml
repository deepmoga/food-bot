name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          # Go to project directory
          cd /home/foodbot/public_html

          # Pull latest code
          git pull origin main

          # Run DB migrations (idempotent — safe on every deploy)
          mysql -u foodbot -p'FoodBot@2024' food_bot < migrate_msg_vendor_id.sql
          mysql -u foodbot -p'FoodBot@2024' food_bot < migrate_order_number_length.sql
          mysql -u foodbot -p'FoodBot@2024' food_bot < migrate_payment_gateway_wallet.sql
          mysql -u foodbot -p'FoodBot@2024' food_bot < migrate_wallet_settlements.sql
          mysql -u foodbot -p'FoodBot@2024' food_bot < migrate_wallet_commission.sql

          # Install production dependencies
          npm install --production

          # Restart application using PM2 (start it if it isn't registered)
          pm2 restart foodbot || pm2 start index.js --name foodbot
          pm2 save
