name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          # Go to project directory
          cd /home/site6/public_html
          
          # Pull latest code, forcing overwrite of any local edits on the VPS
          git fetch --all
          git reset --hard origin/main
          
          # Run diagnostics immediately to capture current state
          node diagnostics.js || true
          
          # Install production dependencies
          npm install --production
          
          # Delete old processes if they exist to clear bad path/name registration
          pm2 delete food-bot || true
          pm2 delete foodbot || true
          
          # Start the process fresh with the correct path and name
          pm2 start index.js --name food-bot
          
          # Save PM2 state
          pm2 save
